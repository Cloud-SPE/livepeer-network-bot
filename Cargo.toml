[package]
name = "livepeer-payout-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Discord bot that watches winning-ticket payouts from the Livepeer protocol explorer and posts digests + periodic summaries."
license = "MIT"
publish = false

[[bin]]
name = "livepeer-payout-bot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
poise = "0.6"
progenitor-client = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
pretty_assertions = "1"

[build-dependencies]
openapiv3 = "2"
prettyplease = "0.2"
progenitor = "0.9"
serde_json = "1"
syn = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
